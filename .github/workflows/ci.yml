name: CI

on:
  # Run build+test on push to main, release branches, and every PR — the
  # release-branch workflow (see CLAUDE.md) funnels features into
  # `release/<version>` branches before a single merge to main, and every
  # link in that chain deserves CI coverage. Release publishing stays
  # gated separately (see the `release` job below).
  push:
    branches:
      - main
      - "release/*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify (compile, test, package)
        run: mvn -B --no-transfer-progress verify

      - name: Upload shaded JAR
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-plugins-jar
          path: target/keycloak-plugins-*.jar
          if-no-files-found: error

  release:
    name: Release
    needs: build
    # Only publish from main — PRs and workflow_dispatch from other refs
    # still get build+test coverage via the `build` job above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package shaded JAR
        run: mvn -B --no-transfer-progress package -DskipTests

      - name: Read version from POM
        id: version
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          artifacts: target/keycloak-plugins-*.jar
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}
